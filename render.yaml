services:
  - type: web
    name: sb-atuacao-semanal
    runtime: static
    plan: free
    buildCommand: mkdir -p public && cp index.html public/index.html
    staticPublishPath: ./public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
