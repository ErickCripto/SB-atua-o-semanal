<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="config.js"></script>
</head>
<body>
<title>Mesa de Carteiras</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="color-scheme" content="only light">
<style>
/* Layout: tela de sistema interno (mesmo visual do sistema da base) — faixa de título, abas verde-petróleo, painel com sub-abas laranja, caixas de grupo com legenda e grade zebrada com cabeçalho verde */
:root,:root[data-theme="dark"],:root[data-theme="light"]{color-scheme:only light}
@media (prefers-color-scheme:dark){:root,:root:not([data-theme="light"]){color-scheme:only light}}
:root{
  color-scheme:only light;
  --page:#E9EEEC; --win:#FFFFFF; --strip1:#DCE9E3; --strip2:#F7FAF9;
  --teal:#1E6E5C; --teal-d:#155445; --teal-l:#2E8B74; --menu:#2FA27B;
  --org1:#FBD38A; --org2:#F2A93B; --org-b:#D88E22;
  --line:#C5D0CC; --line-l:#DDE4E1; --zebra:#EEF1F0; --hover:#FFF4CC;
  --txt:#1A1A1A; --mut:#5E6B67; --inp:#E3E3E3; --inp-b:#B9B9B9;
  --ok:#1B7A3D; --ok-bg:#DDF2E3; --warn:#8A5A00; --warn-bg:#FDEFC8; --bad:#B42318; --bad-bg:#FBE0DD; --info:#1F5A96; --info-bg:#DDE9F7;
  --font:Tahoma,Verdana,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--page)!important;color:var(--txt)!important}
option,optgroup{background:#fff;color:#1A1A1A}
input[type=date]{color-scheme:only light}
body{font:12.5px/1.4 var(--font);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--strip1)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--org2);outline-offset:1px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--mut)}.small{font-size:11.5px}.strong{font-weight:bold}
.menu{position:fixed;left:0;top:0;bottom:0;width:22px;background:linear-gradient(90deg,#3DB88C,var(--menu));color:#fff;display:flex;align-items:center;justify-content:center;z-index:4}
.menu{border:0;padding:0;cursor:pointer;flex-direction:column;gap:14px}
.menu:hover{background:linear-gradient(90deg,#45C597,#2B9470)}
.menu span,.menu b{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:bold;letter-spacing:.12em;font-size:11px}
.menu b{font-size:9.5px;background:rgba(255,255,255,.22);border-radius:3px;padding:6px 1px}
.escolha{display:grid;justify-items:center;gap:22px;padding:34px 8px 46px}
.esc-h{text-align:center;display:grid;gap:4px}
.esc-ola{font-size:22px;font-weight:bold;color:var(--teal-d)}
.esc-perg{font-size:15px;color:#333}
.esc-base{font-size:11.5px;color:var(--mut)}
.esc-cards{display:grid;grid-template-columns:repeat(2,minmax(0,300px));gap:18px;width:100%;justify-content:center}
@media (max-width:640px){.esc-cards{grid-template-columns:minmax(0,1fr)}}
.esc-card{display:grid;justify-items:start;gap:7px;text-align:left;background:#fff;border:1px solid var(--line);border-top:5px solid var(--teal-l);border-radius:10px;padding:20px 20px 16px;cursor:pointer;box-shadow:0 2px 0 #D5DEDA;transition:transform .12s,box-shadow .12s,border-color .12s;min-width:0}
.esc-card:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 20px rgba(20,60,50,.14);border-color:var(--teal-l)}
.esc-card:disabled{opacity:.6;cursor:default}
.esc-card+.esc-card{border-top-color:var(--org2)}
.esc-card.atual{background:#F3FAF7}
.esc-ico{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#E3F1EC;color:var(--teal-d)}
.esc-card+.esc-card .esc-ico{background:#FDF0D8;color:#8A5400}
.esc-ico svg{width:28px;height:28px}
.esc-t{font-size:17px;font-weight:bold;color:var(--txt)}
.esc-d{font-size:12.5px;color:#444;line-height:1.45}
.esc-n{font-size:12px;color:var(--mut);padding-top:6px;border-top:1px solid var(--line-l);width:100%}
.esc-n b{color:var(--txt);font-variant-numeric:tabular-nums}
.esc-go{font-weight:bold;color:var(--teal-d);font-size:12.5px}
.esc-card+.esc-card .esc-go{color:#8A5400}
.esc-rod{font-size:12px;color:var(--mut);margin:0}
@media (prefers-reduced-motion:reduce){.esc-card{transition:none}}
.menupop{position:fixed;left:26px;top:calc(90px + env(safe-area-inset-top,0px));z-index:22;width:250px;background:#fff;border:1px solid var(--teal-d);border-radius:8px;box-shadow:0 10px 26px rgba(0,0,0,.2);padding:8px;display:grid;gap:6px}
.mp-h{font-weight:bold;color:var(--teal-d);padding:2px 4px}
.mp-op{display:grid;gap:1px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 9px;cursor:pointer}
.mp-op span{font-size:11px;color:var(--mut)}.mp-op:hover{background:var(--hover)}
.mp-op.on{border-color:var(--teal-l);background:#E8F3EF;box-shadow:inset 3px 0 0 var(--teal-l)}
.mp-n{font-size:11px;color:var(--mut);margin:2px 4px}
@media (max-width:760px){.menupop{left:12px;top:calc(60px + env(safe-area-inset-top,0px))}}
@media (max-width:760px){.menu{display:none}}
.shell{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1560px;margin:0 auto}
@media (min-width:761px){.shell{padding-left:38px}}
@media (max-width:760px){.strip{position:static!important}}
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--page);padding-block:8px 0}
.bar{background:linear-gradient(180deg,var(--strip2),var(--strip1));border:1px solid #C8D8D1;border-radius:14px;padding:7px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:inset 0 1px 0 #fff}
.bar .app{font-weight:bold;color:var(--teal-d);font-size:14px}
.bar .info{margin-left:auto;display:flex;gap:14px;color:var(--mut);font-size:11.5px;flex-wrap:wrap}
.bar .info b{color:var(--txt)}
.tabs[hidden]{display:none!important}
.tabs{display:flex;gap:3px;flex-wrap:wrap;margin-top:8px;padding-left:10px}
.tab{border:1px solid var(--teal-d);border-bottom:0;background:linear-gradient(180deg,var(--teal-l),var(--teal));color:#fff;font-weight:bold;padding:6px 16px 7px;border-radius:9px 9px 0 0;cursor:pointer;font-size:12px}
.tab:hover{background:linear-gradient(180deg,#39A086,var(--teal-l))}
.tab[aria-current="page"]{background:#fff;color:var(--txt);border-color:var(--teal-l);position:relative;top:1px}
main{background:var(--win);border:1px solid var(--teal-l);border-radius:0 10px 10px 10px;padding:12px 14px 18px;margin-bottom:40px;min-height:60vh}
.ptitle{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:bold;font-size:14px;color:var(--teal-d);padding-bottom:8px;margin-bottom:10px;border-bottom:1px solid var(--line-l)}
.ptitle .muted{font-weight:normal;font-size:12px}
.right{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.panel{border:1px solid var(--line);border-radius:8px;margin-top:12px;background:#fff}
.subtabs{display:flex;gap:3px;flex-wrap:wrap;padding:6px 8px 0;border-bottom:1px solid var(--org-b);background:linear-gradient(180deg,#FFF8EC,#fff)}
.stab{border:1px solid var(--org-b);border-bottom:0;background:linear-gradient(180deg,var(--org1),var(--org2));color:#2B1A00;font-weight:bold;padding:5px 13px;border-radius:8px 8px 0 0;cursor:pointer;font-size:12px}
.stab:hover{filter:brightness(1.05)}
.stab.on{background:#fff;position:relative;top:1px}
.pbody{padding:10px}
fieldset.box{border:1px solid var(--teal-l);border-radius:6px;padding:8px 10px 10px;margin:0 0 12px;min-width:0}
fieldset.box.in{border-color:var(--line)}
fieldset.box legend{font-weight:bold;padding:0 5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
legend .cnt{font-weight:normal;color:var(--mut)}
.hint{color:var(--mut);margin:0 0 8px;font-size:11.5px;max-width:120ch}
.fgrid{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-end}
.fl{display:grid;gap:3px;font-size:11.5px;color:#333;min-width:0}
.fl.grow{flex:1;min-width:180px}
.fbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.form{display:grid;gap:9px}
.inp{background:var(--inp);border:1px solid var(--inp-b);border-radius:9px;padding:4px 9px;min-height:28px;min-width:0;max-width:100%}
.inp:focus{background:#fff}
textarea.inp{border-radius:6px;width:100%;resize:vertical}
.mono{font-family:Consolas,"Courier New",monospace;font-size:12px}
input[type=checkbox]{accent-color:var(--teal)}
.ck{display:flex;gap:6px;align-items:flex-start}
.btn{border:1px solid #9FB0AA;background:linear-gradient(180deg,#FFFFFF,#E2E8E6);border-radius:6px;padding:4px 12px;min-height:28px;cursor:pointer;font-weight:bold;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.btn:hover{background:linear-gradient(180deg,#fff,#D3DDD9)}
.btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:linear-gradient(180deg,var(--teal-l),var(--teal));border-color:var(--teal-d);color:#fff}
.btn.pri:hover{background:linear-gradient(180deg,#39A086,var(--teal-l))}
.btn.sm{padding:2px 8px;min-height:24px;font-size:11.5px}
.btn.danger{color:var(--bad)}.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.push-left{margin-right:auto}
.lk{border:0;background:none;padding:0;color:#0B4F9E;cursor:pointer;text-align:left;font:inherit}
.lk:hover{text-decoration:underline}
.seg{display:inline-flex;border:1px solid #9FB0AA;border-radius:6px;overflow:hidden}
.seg button{border:0;border-right:1px solid #C9D3CF;background:linear-gradient(180deg,#fff,#E7ECEA);padding:3px 10px;cursor:pointer;font-weight:bold;font-size:11.5px}
.seg button:last-child{border-right:0}
.seg button.on{background:linear-gradient(180deg,var(--teal-l),var(--teal));color:#fff}
.tw{overflow:auto;border:1px solid var(--line);border-radius:4px;max-height:70vh;background:#fff}
table.grid{border-collapse:collapse;width:100%}
.grid th{position:sticky;top:0;z-index:1;background:linear-gradient(180deg,#257A66,var(--teal));color:#fff;font-weight:bold;text-align:center;padding:5px 8px;border-right:1px solid #4E9584;white-space:nowrap;font-size:11.5px}
.grid td{padding:4px 8px;border-right:1px solid var(--line-l);border-bottom:1px solid var(--line-l);vertical-align:top}
.grid tbody tr:nth-child(even) td{background:var(--zebra)}
.grid tbody tr:hover td{background:var(--hover)}
.grid tr.done td{color:#8A9692}
.grid tr.done td .lk{color:#6C8BB0}
.grid tr.hot td:first-child,.grid tr.hot td:nth-child(2){box-shadow:inset 3px 0 0 var(--org2)}
.grid tr.conf td{background:#EAF6EE}
.grid td.r{text-align:right;white-space:nowrap}.grid td.c{text-align:center}
.grid td.wrap{white-space:normal;min-width:160px;max-width:300px}
.grid td.ced{min-width:180px;max-width:280px}
.grid td.nw{white-space:nowrap}
.lupa{display:flex;align-items:center;gap:0;background:var(--inp);border:1px solid var(--inp-b);border-radius:9px;padding-left:8px;color:#1F5A96}
.lupa .inp{border:0;background:transparent;flex:1;min-width:0}
.lupa:focus-within{background:#fff;outline:2px solid var(--org2)}
.grid td.anot{min-width:200px;max-width:280px}
.grid tbody tr.editrow td{background:#FFF8E5!important;border-top:2px solid var(--org2);border-bottom:2px solid var(--org2)}
.ea{display:grid;gap:8px;max-width:1100px}.ea-g{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:900px){.ea-g{grid-template-columns:repeat(2,minmax(0,1fr))}}@media (max-width:520px){.ea-g{grid-template-columns:minmax(0,1fr)}}
.sub{font-size:11px;color:var(--mut)}
.bad-t{color:var(--bad);font-weight:bold}
.st{display:inline-block;padding:1px 7px;border-radius:3px;font-size:11px;font-weight:bold;border:1px solid transparent;white-space:nowrap}
.st.ok{color:var(--ok);background:var(--ok-bg);border-color:#A7D9B6}.st.warn{color:var(--warn);background:var(--warn-bg);border-color:#EBCB7A}.st.bad{color:var(--bad);background:var(--bad-bg);border-color:#F0B0A9}.st.info{color:var(--info);background:var(--info-bg);border-color:#ABC6E8}.st.neutral{color:#4C5753;background:#E7EBEA;border-color:#C9D1CE}
.why{display:inline-block;background:#F0F5F3;border:1px solid #CFDCD6;border-radius:3px;padding:0 5px;margin:1px 0;font-size:11px}
.dl{font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}.dl.up{color:var(--ok)}.dl.down{color:var(--bad)}.dl.flat{color:var(--mut)}
.meter{position:relative;height:5px;background:#DCE3E0;border-radius:2px;width:96px;margin-top:3px}
.meter>span{position:absolute;inset:0 auto 0 0;background:var(--teal-l);border-radius:2px}
.meter.over>span{background:var(--bad)}
.meter>i{position:absolute;top:-3px;width:2px;height:11px;background:#7A5B00}
.star{border:0;background:none;cursor:pointer;font-size:16px;color:#B8C2BE;line-height:1}
.star.on{color:#E0A100}
.totbar{display:flex;flex-wrap:wrap;gap:6px 24px;padding:7px 10px;border:1px solid var(--line);border-top:0;background:#F6F8F7;font-size:11.5px;border-radius:0 0 4px 4px}
.totbar b{font-variant-numeric:tabular-nums}
.foot{color:var(--mut);font-size:11.5px;margin:8px 0 0;max-width:140ch}
.kps{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.kp{border:1px solid var(--line);border-left:4px solid var(--teal-l);background:#FAFCFB;border-radius:4px;padding:6px 12px;min-width:150px;display:grid;gap:1px}
.kp small{color:var(--mut);font-size:11px}.kp b{font-size:16px;font-variant-numeric:tabular-nums}.kp span{font-size:11px;color:var(--mut)}
.kp.good{border-left-color:var(--ok)}.kp.bad{border-left-color:var(--bad)}.kp.warn{border-left-color:var(--org2)}
.kps.sm .kp{min-width:120px}.kps.sm .kp b{font-size:14px}.kp b.sm{font-size:12px}
.cols{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:1000px){.cols{grid-template-columns:minmax(0,1fr)}}
.pre{white-space:pre-wrap;font-family:Consolas,"Courier New",monospace;font-size:12px;background:#F7F9F8;border:1px solid var(--line-l);padding:8px;margin:0;max-height:320px;overflow:auto;overflow-wrap:anywhere}
.pre-w{white-space:pre-wrap;overflow-wrap:anywhere}
.gwrap{border:1px solid var(--line,#C9D1CE);border-radius:4px;overflow:hidden;background:#f6f5f2}.gframe{display:block;width:100%;height:calc(100vh - 230px);min-height:560px;border:0}
.voltar{display:inline-flex;align-items:center;gap:4px;margin:0 0 8px;padding:5px 12px 5px 8px;border:1px solid #9FD0BE;border-radius:16px;background:#fff;color:#1F5C4B;font-weight:bold;cursor:pointer;font:inherit;font-weight:bold}.voltar:hover{background:#E3F1EC}
.umenu{position:relative;display:inline-block;outline:none}
.uchip{display:inline-flex;align-items:center;gap:6px;padding:3px 8px 3px 3px;border:1px solid #9FD0BE;border-radius:18px;background:#fff;cursor:pointer}
.uav{width:24px;height:24px;border-radius:50%;background:var(--tab1,#1F7A62);color:#fff;font-weight:bold;font-size:11px;display:inline-flex;align-items:center;justify-content:center}
.unm{font-weight:bold;color:#20332D}.ucar{color:#5B6B66;font-size:10px}
.udrop{display:none;position:absolute;right:0;top:100%;margin-top:4px;min-width:230px;background:#fff;border:1px solid #C9D1CE;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:40;padding:4px 0}
.umenu:hover .udrop,.umenu:focus-within .udrop{display:block}
.umenu::after{content:"";position:absolute;left:0;right:0;top:100%;height:6px}
.uhd{display:flex;flex-direction:column;gap:1px;padding:6px 12px 8px;border-bottom:1px solid #E3E8E6;font-size:12px;color:#5B6B66}.uhd b{color:#20332D;font-size:13px}
.uit{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 12px;cursor:pointer;font:inherit;color:#20332D}.uit:hover,.uit.on{background:#E3F1EC}
.kp b.ok{color:var(--ok)}.kp b.warn{color:var(--warn)}.kp b.bad{color:var(--bad)}td.bad{color:var(--bad);font-weight:bold}
.warn-box{background:var(--warn-bg);border:1px solid #EBCB7A;border-radius:4px;padding:6px 9px;margin:4px 0}
.info-box{background:#E8F1FB;border:1px solid #ABC6E8;border-radius:4px;padding:6px 9px;margin:4px 0}
.warn-box.bloq{background:var(--bad-bg);border-color:#F0B0A9}.warn-box.bloq ul{margin:4px 0 0 18px;padding:0}.warn-box.bloq li{margin:3px 0}
.ok-box{background:var(--ok-bg);border:1px solid #A7D9B6;border-radius:4px;padding:6px 9px;margin:4px 0;color:#14502A}
.banner.pessoa{background:#E3F1EC;border-color:#9FD0BE}
.banner{background:var(--warn-bg);border:1px solid #EBCB7A;padding:7px 10px;border-radius:4px;margin-bottom:10px}
.empty{display:grid;gap:10px;justify-items:start;padding:6px 2px}.empty p{margin:0;max-width:90ch}
.loading{padding:50px;text-align:center;color:var(--mut)}
.hrow{border-bottom:1px solid var(--line-l);padding:6px 0}.hrow summary{cursor:pointer}
.row-b{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.chl{padding:4px 0;border-bottom:1px solid var(--line-l)}
.ah{border-left:3px solid var(--line);padding-left:8px;margin-top:6px}
.chart{width:100%;height:auto;display:block}
.drop{border:2px dashed #9FB0AA;border-radius:8px;padding:18px;display:grid;gap:4px;justify-items:center;text-align:center;cursor:pointer;background:#F7F9F8}
.drop.over,.drop:hover{border-color:var(--teal-l);background:#E8F3EF}
.pick{display:grid;gap:5px}.pick-i{display:flex;justify-content:space-between;gap:8px;border:1px solid var(--line);background:#fff;border-radius:4px;padding:7px 9px;cursor:pointer;flex-wrap:wrap;text-align:left}.pick-i:hover{background:var(--hover)}
.err{color:var(--bad)}
.carregando::before{content:"";display:inline-block;width:12px;height:12px;margin-right:7px;vertical-align:-2px;border:2px solid var(--line);border-top-color:var(--teal-l);border-radius:50%;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.scrim{position:fixed;inset:0;background:rgba(20,40,35,.35);z-index:20}
.win{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(620px,calc(100% - 20px));background:#fff;z-index:21;border:1px solid var(--teal-d);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden}
.win.wide{width:min(900px,calc(100% - 20px))}
.win-h{background:linear-gradient(180deg,var(--teal-l),var(--teal));color:#fff;font-weight:bold;padding:7px 10px 7px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.xbtn{border:1px solid rgba(255,255,255,.6);background:transparent;color:#fff;border-radius:4px;width:26px;height:24px;cursor:pointer}
.xbtn:hover{background:rgba(255,255,255,.18)}
.win-b{overflow:auto;padding:12px;display:grid;gap:10px;align-content:start;flex:1}
.win-f{display:flex;gap:8px;justify-content:flex-end;padding:8px 12px;border-top:1px solid var(--line);background:#F6F8F7;flex-wrap:wrap}
.login{display:flex;justify-content:center;padding:30px 0 50px}
.lwin{width:min(440px,100%);border:1px solid var(--teal-d);border-radius:8px;overflow:hidden;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.12)}

<script>
/* ===== MOTOR DE CÁLCULO (mesma lógica da planilha Controle de Carteiras) ===== */
const Engine=(function(){
  const norm=s=>String(s==null?"":s).trim().toUpperCase();
  const num=v=>{if(typeof v==="number")return v;if(v==null||v==="")return 0;const s=String(v).replace(/\s/g,"");const n=s.includes(",")?parseFloat(s.replace(/\./g,"").replace(",",".")):parseFloat(s);return isNaN(n)?0:n};
  const r6=x=>Math.round(x*1e6)/1e6, r2=x=>Math.round(x*100)/100;
  const starts=(motivo,list)=>{const m=norm(motivo);if(!m)return false;return list.some(p=>{const q=norm(p);return q&&m.startsWith(q)})};
  const countStarts=(motivo,list)=>{const m=norm(motivo);if(!m)return 0;let c=0;list.forEach(p=>{const q=norm(p);if(q&&m.startsWith(q))c++});return c};

  /* Localiza as colunas pelo cabeçalho (resiste a colunas fora de ordem) */
  function mapCols(hdr){
    const H=hdr.map(h=>norm(h));
    const find=(...names)=>{for(const n of names){const i=H.indexOf(norm(n));if(i>=0)return i}return -1};
    const c={cod:find("Cod. Cedente","Cód. Cedente","Cod Cedente"),ced:find("Cedente"),valor:find("Vlr. Aberto","Vlr Aberto"),
      motivo:find("Motivo Entrega"),mon:find("Monitorada"),sacado:find("Sacado"),codSac:find("Cod. Sacado"),rotulo:find("Rótulo","Rotulo"),
      nf:find("Seu Número","Seu Numero"),emissao:find("Emissão NFe"),venc:find("Venc. Orig."),mercEnt:find("Merc. Ent."),aditivo:find("Aditivo")};
    return c;
  }
  function riscoDe(cod,ref){const r=ref.risco[String(cod)];return r==="Alto"||r==="Médio"||r==="Baixo"?r:"Sem risco"}
  function metaDe(cod,risco,ref){
    const me=ref.cfg.metasEspeciais&&ref.cfg.metasEspeciais[String(cod)];
    if(me&&me.meta)return{meta:+me.meta,origem:"Característica"};
    const c=ref.cfg;
    if(risco==="Alto")return{meta:c.metaAlto,origem:"Risco Alto"};
    if(risco==="Médio")return{meta:c.metaMedio,origem:"Risco Médio"};
    if(risco==="Baixo")return{meta:c.metaBaixo,origem:"Risco Baixo"};
    return{meta:c.metaPadrao,origem:"Padrão (sem risco)"};
  }
  function statusConf(ind,meta,margem){
    if(ind==null)return"Sem dados";
    if(r6(ind)<r6(meta))return"Abaixo";
    if(r6(ind)<r6(Math.min(1,meta+margem)))return"Atenção";
    return"OK";
  }
  function diaSugerido(cod,risco){
    const par=(+cod)%2===0;
    if(risco==="Alto")return"Diário";
    if(risco==="Baixo")return par?"Quarta":"Quinta";
    return par?"Segunda":"Terça";
  }
  function nivel(t){return t>=30?"A":t>=5?"B":"C"}

  /* Agrega uma base (linhas + cabeçalho) por cedente */
  function agregar(hdr,rows,ref,filtroMon){
    const c=mapCols(hdr);
    if(c.cod<0||c.valor<0||c.motivo<0)throw new Error("Não encontrei as colunas Cod. Cedente, Vlr. Aberto e Motivo Entrega no cabeçalho.");
    const cfg=ref.cfg,out={};
    rows.forEach(r=>{
      const cod=r[c.cod];if(cod==null||cod==="")return;
      if(filtroMon&&cfg.soMonitorados&&norm(r[c.mon])!=="S")return;
      const k=String(typeof cod==="number"?cod:String(cod).trim());
      const o=out[k]||(out[k]={cod:k,nome:"",tit:0,titConf:0,valor:0,vconf:0,vc99:0,vna:0,vnc:0,motivos:{},rotulos:{}});
      if(!o.nome)o.nome=String(r[c.ced]||"").trim();
      const v=num(r[c.valor]),m=r[c.motivo];
      o.tit++;o.valor+=v;
      const nc=countStarts(m,cfg.motivosConf); // a planilha soma por prefixo (SUMPRODUCT)
      if(nc){o.titConf+=nc;o.vconf+=v*nc}
      o.vc99+=v*countStarts(m,cfg.motivosC99);
      o.vna+=v*countStarts(m,cfg.motivosNA);
      o.vnc+=v*countStarts(m,cfg.motivosNC);
      const mk=String(m==null||m===""?"(sem motivo)":m).trim().slice(0,90);
      const mm=o.motivos[mk]||(o.motivos[mk]={q:0,v:0});mm.q++;mm.v+=v;
      if(c.rotulo>=0&&r[c.rotulo])o.rotulos[String(r[c.rotulo])]=1;
    });
    return out;
  }

  function pistas(texto,checagem){
    const z=String(texto||"");if(!z||(z.length<80&&/SEM CARACTER/i.test(z)))return"";
    const p=[];
    if(/aceite/i.test(z))p.push("Cita aceite");
    if(/e-mail/i.test(z))p.push("Cita e-mail");
    if(/portal/i.test(z))p.push("Cita portal");
    const i=z.indexOf("D+");if(i>=0){const mm=z.slice(i+2,i+4).match(/^\d{1,2}/);p.push("Prazo D+"+(mm?String(+mm[0]):""))}
    if(/canhoto/i.test(z))p.push("Cita canhoto");
    if(/não realizar ligaç|não ligar/i.test(z))p.push("NÃO ligar ao sacado");
    if(/% da carteira|mínima da carteira/i.test(checagem||""))p.push("% próprio de checagem");
    return p.length?p.join("  ·  "):"Sem pista (ver cadastro)";
  }
  function checagem(texto){
    const z=String(texto||"");const i=z.indexOf("CHECAGEM:");if(i<0)return"";
    const st=i+9;let end=z.length;
    ["GARANTIAS FORMALIZADAS:","JURIDICO:","MONITORAMENTO:","TESOURARIA:","COBRANÇA:","OPERAÇÃO:"].forEach(t=>{const j=z.indexOf(t,st);if(j>=0&&j<end)end=j});
    return z.slice(st,end).trim();
  }

  /* Monta o registro do dia (carteira + tranche) */
  function calcular(baseCart,baseTr,ref,anot){
    const cfg=ref.cfg;anot=anot||{};
    const A=baseCart?agregar(baseCart.hdr,baseCart.rows,ref,true):{};
    const T=baseTr?agregar(baseTr.hdr,baseTr.rows,ref,false):{};
    const cods=[...new Set([...Object.keys(A),...Object.keys(T)])].sort((a,b)=>(+a)-(+b)||a.localeCompare(b));
    const linhas=cods.map(cod=>{
      const a=A[cod],t=T[cod];
      const risco=riscoDe(cod,ref),{meta,origem}=metaDe(cod,risco,ref);
      const L={cod,nome:(a&&a.nome)||(t&&t.nome)||"",risco,meta,origemMeta:origem,naCarteira:!!a,naTranche:!!t};
      const an=anot[cod]||{};
      L.dia=an.dia||diaSugerido(cod,risco);
      if(a){
        L.tit=a.tit;L.titConf=a.titConf;L.valor=r2(a.valor);L.vconf=r2(a.vconf);
        L.ind=a.valor>0?a.vconf/a.valor:null;
        L.c99=a.valor>0?a.vc99/a.valor:null;L.na=a.valor>0?a.vna/a.valor:null;L.nc=a.valor>0?a.vnc/a.valor:null;
        L.nivel=nivel(a.tit);L.status=statusConf(L.ind,meta,cfg.margem);
        L.faltam=L.ind==null?null:Math.max(0,r2(meta*a.valor-a.vconf));
        L.motivos=Object.fromEntries(Object.entries(a.motivos).map(([k,v])=>[k,{q:v.q,v:r2(v.v)}]));
        L.rotulos=Object.keys(a.rotulos).slice(0,5);
      }else{L.status="Sem dados"}
      if(t){
        const lim=ref.lim[cod];const temLim=lim&&lim.limite!==""&&lim.limite!=null&&!isNaN(+lim.limite);
        const pr=cfg.metasTranchePropria&&cfg.metasTranchePropria[cod];
        const mu=pr&&pr.meta?+pr.meta:risco==="Alto"?cfg.trAlto:risco==="Médio"?cfg.trMedio:risco==="Baixo"?cfg.trBaixo:cfg.trSem;
        const I=r2(t.valor),J=temLim?+lim.limite:null;
        L.tr={tit:t.tit,valor:I,limite:J,fundo:lim?lim.fundo:"",metaUso:mu,aviso:pr?pr.aviso||"":"",
          pct:J==null?null:J>0?I/J:(I>0?"Limite zero":0),
          teto:J==null?null:r2(J*mu),excesso:J==null?null:Math.max(0,r2(I-J)),
          reduzir:J==null?null:Math.max(0,r2(I-r2(J*mu))),folga:J==null?null:Math.max(0,r2(J-I)),
          ind:t.valor>0?t.vconf/t.valor:null,c99:t.valor>0?t.vc99/t.valor:null,na:t.valor>0?t.vna/t.valor:null,nc:t.valor>0?t.vnc/t.valor:null};
        L.tr.status=J==null?"Sem limite":r2(I)>r2(J)?"EXCESSO":r2(I)>r2(L.tr.teto)?"Acima da meta":"OK";
        L.tr.statusConf=statusConf(L.tr.ind,meta,cfg.margem);
      }
      return L;
    });
    return linhas;
  }

  /* Lê uma planilha do SheetJS em {hdr, rows} achando a linha de cabeçalho */
  function lerAba(ws,XLSX){
    const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:false});
    let h=-1;for(let i=0;i<Math.min(15,aoa.length);i++){const n=(aoa[i]||[]).map(norm);if(n.includes("MOTIVO ENTREGA")&&n.some(x=>x==="COD. CEDENTE"||x==="CÓD. CEDENTE"||x==="COD CEDENTE")){h=i;break}}
    if(h<0)return null;
    return{hdr:aoa[h],rows:aoa.slice(h+1).filter(r=>r&&r.some(v=>v!=null&&v!==""))};
  }
  return{agregar,calcular,riscoDe,metaDe,statusConf,diaSugerido,nivel,pistas,checagem,lerAba,mapCols,num,norm};
})();
if(typeof module!=="undefined")module.exports=Engine;

x;display:block}\n.pchip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:14px;background:var(--surface-2)}\n.pchip b{font-size:15px}\n.car{border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin:8px 0;background:var(--surface)}\n.car .who{font-size:12.5px;color:var(--text-2);margin-bottom:6px}\n.car .txt{white-space:pre-wrap;font-size:13.5px;line-height:1.5}\n.car.empty .txt{color:var(--text-3);font-style:italic}\ndetails summary{cursor:pointer;color:var(--text-2)}\n.note{font-size:12.5px;color:var(--text-2)}\n.note li{margin:3px 0}\n.chip{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--text-2);margin-left:6px}\n.ragc{border:1px solid var(--border);border-radius:8px;padding:10px 12px;min-width:300px;flex:1 1 300px;max-width:520px}\n.ragc h3{margin:0 0 6px;font-size:13px;letter-spacing:.02em}\n.ragc table{width:100%;border-collapse:collapse;font-size:12.5px}\n.ragc td{padding:4px 0;border-top:1px solid var(--border);vertical-align:top}\n.ragc td:last-child{text-align:right;white-space:nowrap;padding-left:12px;font-weight:600}\n.ragc.cwrap td:last-child{white-space:normal;text-align:left;width:62%}\n.ragc .obr{color:var(--c-prob)}.ragc .imp{color:#a86f00}\n.dced td{background:var(--surface-2);font-weight:600;cursor:pointer}\n.dced td .muted{font-weight:400}\n.dsac td:first-child{padding-left:26px}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n<header>\n  <h1>Índice de Confirmação da Carteira<\/h1>\n  <p id=\"hdr\"><\/p>\n<\/header>\n\n<div class=\"filters\">\n  <div class=\"toprow\"><div class=\"f fced\"><label for=\"fCed\">Cedente<\/label><input type=\"search\" id=\"fCed\" list=\"dlCed\" placeholder=\"Digite o nome ou código do cedente\" autocomplete=\"off\"><datalist id=\"dlCed\"><\/datalist><\/div>\n  <div class=\"f fced\"><label for=\"fGrp\">Grupo econômico<\/label><input type=\"search\" id=\"fGrp\" list=\"dlGrp\" placeholder=\"Digite o nome ou código do grupo (G_ / P_)\" autocomplete=\"off\"><datalist id=\"dlGrp\"><\/datalist><\/div><\/div>\n  <div class=\"f\"><label for=\"fFil\">Filial<\/label><select id=\"fFil\"><\/select><\/div>\n  <div class=\"f\"><label for=\"fReg\">Regional<\/label><select id=\"fReg\"><\/select><\/div>\n  <div class=\"f\"><label for=\"fPri\">Pricing<\/label><select id=\"fPri\"><\/select><\/div>\n  <div class=\"f\"><label for=\"fUF\">Região / UF do sacado<\/label><select id=\"fUF\" style=\"max-width:200px\"><\/select><\/div>\n  <div class=\"f\"><label for=\"fRot\">Rótulo<\/label><select id=\"fRot\" style=\"max-width:240px\"><\/select><\/div>\n  <div class=\"f\"><label for=\"fMot\">Motivo Entrega<\/label><select id=\"fMot\" style=\"max-width:240px\"><\/select><\/div>\n  <div class=\"f\"><label>Medida<\/label><div class=\"seg\" id=\"meas\"><button data-m=\"v\" class=\"on\">Valor<\/button><button data-m=\"q\">Quantidade<\/button><\/div><\/div>\n  <button class=\"btn\" id=\"clr\">Limpar filtros<\/button>\n<\/div>\n\n<div class=\"card\" id=\"priCard\" hidden style=\"border-left:4px solid var(--accent);padding:12px 16px\">\n  <div style=\"display:flex;align-items:center;gap:14px;flex-wrap:wrap\"><h2 style=\"margin:0\">Pricing<\/h2><div id=\"priBody\" style=\"display:flex;gap:10px;flex-wrap:wrap;align-items:center\"><\/div><\/div>\n  <details id=\"priDet\" hidden style=\"margin-top:10px\"><summary style=\"cursor:pointer;font-size:13px;color:var(--accent);font-weight:600\">Exibir condições do Pricing<\/summary><div id=\"priCond\" style=\"display:flex;gap:12px;flex-wrap:wrap;margin-top:10px\"><\/div><\/details>\n<\/div>\n\n<div class=\"card\" id=\"ragCard\" hidden style=\"border-left:4px solid var(--accent);padding:12px 16px\">\n  <div style=\"display:flex;align-items:center;gap:14px;flex-wrap:wrap\"><h2 style=\"margin:0\">Rating Agro<\/h2><div id=\"ragBody\" style=\"display:flex;gap:10px;flex-wrap:wrap;align-items:center\"><\/div><\/div>\n  <details id=\"ragDet\" hidden style=\"margin-top:10px\"><summary style=\"cursor:pointer;font-size:13px;color:var(--accent);font-weight:600\">Exibir condições do Rating Agro<\/summary><div id=\"ragCond\" style=\"display:flex;gap:12px;flex-wrap:wrap;margin-top:10px\"><\/div><\/details>\n<\/div>\n\n<div class=\"card\" id=\"carCard\" hidden style=\"border-left:4px solid var(--accent)\">\n  <h2>Característica da Checagem<\/h2>\n  <p class=\"sub\" id=\"carSub\"><\/p>\n  <div id=\"carBody\"><\/div>\n<\/div>\n\n<div class=\"kpis\" id=\"kpis\"><\/div>\n\n<div class=\"legend\" id=\"leg\"><\/div>\n\n<div class=\"card\">\n  <h2>Por Regional<\/h2>\n  <p class=\"sub\">Composição do resultado da checagem. Ordenado pelo índice de confirmação. Clique numa linha para filtrar.<\/p>\n  <div id=\"cReg\"><\/div>\n<\/div>\n\n\n<div class=\"card\">\n  <h2>Confirmação<\/h2>\n  <p class=\"sub\">Abertura do Total Confirmado por forma de confirmação. Percentuais sobre a carteira e sobre o confirmado, na medida selecionada.<\/p>\n  <div class=\"kpis\" id=\"evK\" style=\"margin:8px 0 12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))\"><\/div>\n  <div class=\"bar\" id=\"evBar\" style=\"height:20px;margin:4px 0 6px\"><\/div>\n  <div class=\"legend\" id=\"evLeg\" style=\"margin-bottom:14px\"><\/div>\n  <div class=\"toolbar\" style=\"margin:0\"><div class=\"sub\" style=\"margin:0\">Detalhe por motivo e por regional<\/div><button class=\"btn\" id=\"evTog\" aria-expanded=\"false\">▸ Expandir<\/button><\/div>\n  <div id=\"evBody\" hidden style=\"margin-top:10px\">\n    <div class=\"tw\" style=\"max-height:none;margin-bottom:14px\"><table id=\"tEv\"><\/table><\/div>\n    <div class=\"tw\" style=\"max-height:none\"><table id=\"tEvR\"><\/table><\/div>\n  <\/div>\n<\/div>\n\n<div class=\"card\">\n  <h2>Por Região do Sacado<\/h2>\n  <p class=\"sub\">Região/UF de entrega (sacado). Clique numa linha para filtrar.<\/p>\n  <div id=\"cRgs\"><\/div>\n  <div style=\"margin-top:8px\"><button class=\"btn\" id=\"ufTog\" aria-expanded=\"false\">▸ Ver por UF<\/button><\/div>\n  <div id=\"ufBody\" hidden style=\"margin-top:8px\"><div id=\"cUF\" class=\"wide\"><\/div><\/div>\n<\/div>\n\n<div class=\"card geral-only\">\n  <div class=\"toolbar\">\n    <div><h2 style=\"display:inline\">Cedente × Região do Sacado<\/h2><span class=\"chip\" id=\"crCount\"><\/span>\n    <p class=\"sub\" style=\"margin:2px 0 0\">% confirmado por região dos sacados de cada cedente (entre parênteses, o Vlr. Aberto ou títulos). Clique no cedente para ver os sacados.<\/p><\/div>\n    <button class=\"btn\" id=\"crTog\" aria-expanded=\"false\" aria-controls=\"crBody\">▸ Expandir<\/button>\n  <\/div>\n  <div id=\"crBody\" hidden style=\"margin-top:10px\">\n    <div style=\"display:flex;justify-content:flex-end;margin-bottom:8px\"><input type=\"search\" id=\"qcr\" placeholder=\"Buscar cedente\"><\/div>\n    <div class=\"tw\"><table id=\"tCR\" class=\"cr\"><\/table><\/div>\n    <p class=\"note\" id=\"crMore\"><\/p>\n  <\/div>\n  <div id=\"sacBox\" hidden style=\"margin-top:14px\">\n    <div class=\"toolbar\" style=\"margin:0\">\n      <div><h2 id=\"sacTit\" style=\"font-size:15px;display:inline\"><\/h2><p class=\"sub\" id=\"sacSub\" style=\"margin:2px 0 0\"><\/p><\/div>\n      <button class=\"btn\" id=\"sacTog\" aria-expanded=\"false\" aria-controls=\"sacBody\">▸ Expandir<\/button>\n    <\/div>\n    <div id=\"sacBody\" hidden style=\"margin-top:10px\"><div class=\"tw\"><table id=\"tSac\"><\/table><\/div>\n    <p class=\"note\" id=\"sacMore\"><\/p><\/div>\n  <\/div>\n<\/div>\n\n<div class=\"card\">\n  <h2>Por Rótulo<\/h2>\n  <p class=\"sub\">Tipo de operação do título. Ordenado pelo índice de confirmação. Clique numa linha para filtrar.<\/p>\n  <div id=\"cRot\" class=\"wide\"><\/div>\n<\/div>\n\n<div class=\"card geral-only\">\n  <div class=\"toolbar\" style=\"margin:0\">\n    <div><h2 style=\"display:inline\">Matriz Regional × Situação da checagem<\/h2>\n    <p class=\"sub\" style=\"margin:2px 0 0\">Participação de cada situação no total da regional, na medida selecionada; entre parênteses, o Vlr. Aberto (R$ mi) ou a quantidade de títulos. Ordenado pelo índice de confirmação.<\/p><\/div>\n    <button class=\"btn\" id=\"heatTog\" aria-expanded=\"false\" aria-controls=\"heatBody\">▸ Expandir<\/button>\n  <\/div>\n  <div id=\"heatBody\" hidden style=\"margin-top:12px\"><div class=\"tw\" style=\"max-height:none\"><table class=\"heat\" id=\"tHeat\"><\/table><\/div><\/div>\n<\/div>\n\n<div class=\"card geral-only\">\n  <div class=\"toolbar\" style=\"margin:0\">\n    <div><h2 style=\"display:inline\">Motivo Entrega<\/h2><span class=\"chip\" id=\"motCount\"><\/span>\n    <p class=\"sub\" style=\"margin:2px 0 0\">Cada motivo foi classificado em uma das quatro situações (veja metodologia ao final). Clique numa linha para filtrar.<\/p><\/div>\n    <button class=\"btn\" id=\"motTog\" aria-expanded=\"false\" aria-controls=\"motBody\">▸ Expandir<\/button>\n  <\/div>\n  <div id=\"motBody\" hidden style=\"margin-top:12px\"><div class=\"tw\" style=\"max-height:480px\"><table id=\"tMot\"><\/table><\/div><\/div>\n<\/div>\n\n<div class=\"card\">\n  <div class=\"toolbar\">\n    <div><h2 style=\"display:inline\">Por Grupo Econômico<\/h2><span class=\"chip\" id=\"grpCount\"><\/span><p class=\"sub\" style=\"margin:2px 0 0\">Grupo pela coluna COD_CLIENTE do Pricing. Clique numa linha para filtrar o relatório pelo grupo.<\/p><\/div>\n    <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n      <input type=\"search\" id=\"qg\" placeholder=\"Buscar grupo ou código (G_ / P_)\">\n      <button class=\"btn\" id=\"csvg\">Exportar CSV<\/button>\n    <\/div>\n  <\/div>\n  <div class=\"tw\"><table id=\"tGrp\"><\/table><\/div>\n  <p class=\"note\" id=\"grpMore\"><\/p>\n<\/div>\n\n<div class=\"card\">\n  <div class=\"toolbar\">\n    <div><h2 style=\"display:inline\">Cedentes<\/h2><span class=\"chip\" id=\"cedCount\"><\/span><\/div>\n    <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n      <input type=\"search\" id=\"q\" placeholder=\"Buscar cedente, código ou grupo\">\n      <button class=\"btn\" id=\"csv\">Exportar CSV<\/button>\n    <\/div>\n  <\/div>\n  <div class=\"tw\"><table id=\"tCed\"><\/table><\/div>\n  <p class=\"note\" id=\"cedMore\"><\/p>\n<\/div>\n\n<div class=\"card\" id=\"adtCard\">\n  <div class=\"toolbar\">\n    <div><h2 style=\"display:inline\">Confirmação por Aditivo<\/h2><span class=\"chip\" id=\"adtCount\"><\/span>\n    <p class=\"sub\" style=\"margin:2px 0 0\">Do aditivo mais recente ao mais antigo. Data da negociação lida do número do aditivo (AAMMDD). Valor = Vlr. Aberto dos títulos do aditivo em checagem.<\/p><\/div>\n    <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n      <input type=\"search\" id=\"qa\" placeholder=\"Buscar aditivo ou cedente\">\n      <button class=\"btn\" id=\"csva\">Exportar CSV<\/button>\n    <\/div>\n  <\/div>\n  <div class=\"tw\"><table id=\"tAdt\"><\/table><\/div>\n  <div style=\"margin-top:8px\"><button class=\"btn\" id=\"adtTog\" aria-expanded=\"false\">▸ Mostrar todos<\/button><\/div>\n<\/div>\n\n<div class=\"card\" id=\"dstCard\">\n  <div class=\"toolbar\">\n    <div><h2 style=\"display:inline\">Distância e Prazo de Entrega<\/h2><span class=\"chip\" id=\"dstCount\"><\/span>\n    <p class=\"sub\" style=\"margin:2px 0 0\">Da cidade do cedente até a cidade do sacado, por transportadora. KM e prazo estimado vêm da própria base de checagem; “prazo vencido” = Prazo NF FORA (o prazo de transporte já passou).<\/p><\/div>\n  <\/div>\n  <div class=\"kpis\" id=\"dstK\" style=\"margin:8px 0 12px\"><\/div>\n  <h3 style=\"font-size:14px;margin:4px 0 6px\">Por faixa de distância<\/h3>\n  <div class=\"tw\"><table id=\"tDstF\"><\/table><\/div>\n  <div class=\"toolbar\" style=\"margin-top:16px\">\n    <div><h3 style=\"font-size:14px;margin:0;display:inline\">Cedente × Sacado<\/h3><p class=\"sub\" style=\"margin:2px 0 0\">Na linha do cedente, a distância média e o tempo médio de entrega do cedente (média por título). Clique no cedente para abrir os sacados. Ordenado pelo valor pendente com prazo de entrega vencido.<\/p><\/div>\n    <input type=\"search\" id=\"qd\" placeholder=\"Buscar cedente, sacado ou cidade\">\n  <\/div>\n  <div class=\"tw\"><table id=\"tDst\"><\/table><\/div>\n  <div style=\"margin-top:8px\"><button class=\"btn\" id=\"dstTog\" aria-expanded=\"false\"><\/button><\/div>\n<\/div>\n\n<div class=\"card\">\n  <h2>Metodologia<\/h2>\n  <div class=\"note\">\n    <ul id=\"meth\"><\/ul>\n    <details><summary>Classificação de cada Motivo Entrega<\/summary><div class=\"tw\" style=\"margin-top:8px;max-height:420px\"><table id=\"tMap\"><\/table><\/div><\/details>\n  <\/div>\n<\/div>\n<\/div>\n<div id=\"ov\"><div id=\"dlg\" role=\"dialog\" aria-modal=\"true\">\n  <div class=\"hd\"><div><h2 id=\"pTit\">Títulos com Problema<\/h2><p class=\"sub\" id=\"pSub\" style=\"margin:2px 0 0\"><\/p><\/div>\n  <div style=\"display:flex;gap:8px;flex-wrap:wrap\"><input type=\"search\" id=\"pq\" placeholder=\"Buscar sacado, cedente, título, NF\"><button class=\"btn\" id=\"pcsv\">Exportar CSV<\/button><button class=\"btn\" id=\"pclose\">Fechar ✕<\/button><\/div><\/div>\n  <div class=\"tabs\" id=\"ptabs\"><button data-t=\"s\" class=\"on\">Por sacado<\/button><button data-t=\"t\">Títulos<\/button><\/div>\n  <div class=\"tw\" style=\"max-height:70vh\"><table id=\"tP\"><\/table><\/div>\n<\/div><\/div>\n<div id=\"tip\"><\/div>\n\n<script>\nconst D = __DADOS__;\nconst CL = ['Confirmado','Baixa operacional','Pendente','Problema'];\nconst CV = ['--c-conf','--c-baixa','--c-pend','--c-prob'];\nconst CDESC = {\n 'Confirmado':'Entrega confirmada de forma direta (Sefaz, sacado por telefone/e-mail/WhatsApp, canhoto, transportadora, aceite, portal conforme característica, baixado conforme característica, liquidez da 1ª parcela, DS validada).',\n 'Baixa operacional':'Baixado sem confirmação direta: automático pelo sistema, vencimento, isenção, contas especiais, recompra.',\n 'Pendente':'Checagem em andamento: sem motivo, nada consta (sacado/transportadora), mercadoria não entregue, serviço não executado, não atende, aguardando retorno, sacado não passa informação, telefone incorreto, retirado do C99.',\n 'Problema':'Indício de risco: C99, mercadoria devolvida, pedido/NF cancelada, desconhece pedido, paga ao cedente.'\n};\nconst motCls = D.motivos.map((m,i)=>CL.indexOf(D.classes[i]));\nconst st = {uf:'',sortCR:{k:'v',d:-1},crLimit:50,qcr:'',sortSac:{k:'v',d:-1},ced:null,grp:-1,qg:'',sortGrp:{k:'v',d:-1},grpLimit:50,rot:-1,fil:-1,reg:-1,pri:-1,fx:-1,mot:-1,m:'v',q:'',sortCed:{k:'v',d:-1},sortMot:{k:'v',d:-1},cedLimit:100};\nconst $ = s=>document.querySelector(s);\nconst fmtBRL = v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});\nconst fmtMi = v=>(v/1e6).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});\nconst fmtN = v=>v.toLocaleString('pt-BR');\nconst pct = (a,b)=>b? (100*a/b):0;\nconst fP = x=>x.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';\nconst esc = s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\nconst col = i=>`var(${CV[i]})`;\n\nfunction fillSel(id,arr,all){const s=$(id);s.innerHTML=`<option value=\"-1\">${all}<\/option>`+arr.map((x,i)=>`<option value=\"${i}\">${esc(x)}<\/option>`).join('');}\nconst REGS=['Norte','Nordeste','Centro-Oeste','Sudeste','Sul','(sem UF)'];\nconst regOfUF=i=>D.regiao_uf[D.ufs[i]]||'(sem UF)';\nconst ufIx=s=>{const i=D.ufs.indexOf((s||'').trim().toUpperCase()||'(sem UF)');return i<0?D.ufs.indexOf('(sem UF)'):i;};\nfunction ufOk(i){if(!st.uf)return true;const [k,v]=st.uf.split(':');return k==='R'?regOfUF(i)===v:i===+v;}\nfunction ufLabel(){const [k,v]=st.uf.split(':');return k==='R'?'região '+v:'UF '+D.ufs[+v];}\n$('#fUF').innerHTML='<option value=\"\">Todas<\/option><optgroup label=\"Regiões\">'+REGS.filter(r=>r!=='(sem UF)').map(r=>`<option value=\"R:${r}\">${r}<\/option>`).join('')+'<\/optgroup><optgroup label=\"UF\">'+D.ufs.map((u,i)=>[u,i]).sort((a,b)=>a[0].localeCompare(b[0])).map(([u,i])=>`<option value=\"U:${i}\">${esc(u)}<\/option>`).join('')+'<\/optgroup>';\n$('#fUF').onchange=e=>{st.uf=e.target.value;render();};\nconst isEv=new Set(D.eventos);\nfillSel('#fFil',D.filiais,'Todas');fillSel('#fReg',D.regs,'Todas');fillSel('#fPri',D.pricings,'Todos');fillSel('#fMot',D.motivos,'Todos');fillSel('#fRot',D.rotulos,'Todos');\n[['#fFil','fil'],['#fReg','reg'],['#fPri','pri'],['#fMot','mot'],['#fRot','rot']].forEach(([id,k])=>$(id).onchange=e=>{st[k]=+e.target.value;render();});\ndocument.querySelectorAll('#meas button').forEach(b=>b.onclick=()=>{st.m=b.dataset.m;document.querySelectorAll('#meas button').forEach(x=>x.classList.toggle('on',x===b));render();});\n$('#clr').onclick=()=>{Object.assign(st,{uf:'',ced:null,grp:-1,qg:'',rot:-1,fil:-1,reg:-1,pri:-1,fx:-1,mot:-1,q:''});$('#q').value='';$('#qg').value='';$('#fCed').value='';$('#fCed').classList.remove('on');syncSel();render();};\n$('#q').oninput=e=>{st.q=e.target.value.trim().toUpperCase();st.cedLimit=100;renderCed(lastRows);};\nfunction syncSel(){$('#fUF').value=st.uf;$('#fFil').value=st.fil;$('#fReg').value=st.reg;$('#fPri').value=st.pri;$('#fMot').value=st.mot;$('#fRot').value=st.rot;grpSync();}\nfunction setF(k,v){st[k]=(st[k]===v?-1:v);syncSel();render();}\n\nconst cedOpts=[...new Set(D.rows.map(r=>r[3]))].map(k=>({k,lab:`${(D.ced[k]||[''])[0]} — ${k}`})).sort((a,b)=>a.lab.localeCompare(b.lab));\n$('#dlCed').innerHTML=cedOpts.map(o=>`<option value=\"${esc(o.lab)}\"><\/option>`).join('');\nconst cedByLab=new Map(cedOpts.map(o=>[o.lab,o.k]));\nfunction applyCed(){const v=$('#fCed').value.trim();let k=cedByLab.get(v)||null;\n if(!k&&v){const U=v.toUpperCase();const hits=cedOpts.filter(o=>o.lab.toUpperCase().includes(U));if(hits.length===1)k=hits[0].k;else{const ex=cedOpts.find(o=>o.k===v);if(ex)k=ex.k;}}\n if(k!==st.ced||(!v&&st.ced)){st.ced=v?k:null;if(st.ced)$('#fCed').value=cedOpts.find(o=>o.k===st.ced).lab;$('#fCed').classList.toggle('on',!!st.ced);render();}}\n$('#fCed').addEventListener('change',applyCed);$('#fCed').addEventListener('input',e=>{if(cedByLab.has(e.target.value)||!e.target.value)applyCed();});\n$('#fCed').addEventListener('keydown',e=>{if(e.key==='Enter')applyCed();});\nconst grpOpts=[...new Set(D.rows.map(r=>r[9]))].map(i=>({i,lab:`${D.grupos[i][1]} — ${D.grupos[i][0]}`})).sort((a,b)=>a.lab.localeCompare(b.lab));\n$('#dlGrp').innerHTML=grpOpts.map(o=>`<option value=\"${esc(o.lab)}\"><\/option>`).join('');\nconst grpByLab=new Map(grpOpts.map(o=>[o.lab,o.i]));\nfunction grpSync(){const o=grpOpts.find(x=>x.i===st.grp);$('#fGrp').value=o?o.lab:'';$('#fGrp').classList.toggle('on',st.grp>=0);}\nfunction applyGrp(){const v=$('#fGrp').value.trim();let k=grpByLab.has(v)?grpByLab.get(v):-1;\n if(k<0&&v){const U=v.toUpperCase();const hits=grpOpts.filter(o=>o.lab.toUpperCase().includes(U));if(hits.length===1)k=hits[0].i;}\n if(k!==st.grp){st.grp=k;grpSync();render();}else if(k>=0)grpSync();}\n$('#fGrp').addEventListener('change',applyGrp);$('#fGrp').addEventListener('input',e=>{if(grpByLab.has(e.target.value)||!e.target.value)applyGrp();});\n$('#fGrp').addEventListener('keydown',e=>{if(e.key==='Enter')applyGrp();});\nfunction setCed(k){st.ced=k;$('#fCed').value=k?cedOpts.find(o=>o.k===k).lab:'';$('#fCed').classList.toggle('on',!!k);render();window.scrollTo({top:0,behavior:'smooth'});}\n$('#leg').innerHTML = CL.map((c,i)=>`<span title=\"${esc(CDESC[c])}\"><i class=\"dot\" style=\"background:${col(i)}\"><\/i>${c}<\/span>`).join('');\n\n// tooltip\nconst tip=$('#tip');\nfunction showTip(e,html){tip.innerHTML=html;tip.style.display='block';const w=tip.offsetWidth,h=tip.offsetHeight;let x=e.clientX+14,y=e.clientY+14;if(x+w>innerWidth-8)x=e.clientX-w-14;if(y+h>innerHeight-8)y=e.clientY-h-14;tip.style.left=x+'px';tip.style.top=y+'px';}\ndocument.addEventListener('mousemove',e=>{const t=e.target.closest('[data-tip]');if(t)showTip(e,tipCache[t.dataset.tip]);else tip.style.display='none';});\nlet tipCache={},tipN=0;\nfunction tipFor(title,a){const id='t'+(tipN++);const tq=a.q.reduce((x,y)=>x+y,0),tv=a.v.reduce((x,y)=>x+y,0);\n tipCache[id]=`<b>${esc(title)}<\/b>`+CL.map((c,i)=>`<div class=\"tr\"><span><i class=\"dot\" style=\"background:${col(i)}\"><\/i> ${c}<\/span><span class=\"num\">${fP(pct(a[st.m][i],st.m==='v'?tv:tq))}<\/span><\/div>`).join('')+`<div class=\"tr muted\" style=\"margin-top:4px\"><span>Títulos<\/span><span class=\"num\">${fmtN(tq)}<\/span><\/div><div class=\"tr muted\"><span>Vlr. Aberto<\/span><span class=\"num\">${fmtBRL(tv)}<\/span><\/div>`;return id;}\n\nfunction filtered(){return D.rows.filter(r=>ufOk(r[10])&&(!st.ced||r[3]===st.ced)&&(st.fil<0||r[0]===st.fil)&&(st.reg<0||r[1]===st.reg)&&(st.pri<0||r[2]===st.pri)&&(st.fx<0||r[4]===st.fx)&&(st.mot<0||r[5]===st.mot)&&(st.rot<0||r[8]===st.rot)&&(st.grp<0||r[9]===st.grp));}\nconst z=()=>({q:[0,0,0,0],v:[0,0,0,0]});\nfunction agg(rows,keyFn){const M=new Map();for(const r of rows){const k=keyFn(r);let a=M.get(k);if(!a){a=z();M.set(k,a);}const c=motCls[r[5]];a.q[c]+=r[6];a.v[c]+=r[7];}return M;}\nconst tot=a=>a[st.m].reduce((x,y)=>x+y,0);\nconst idx=a=>pct(a[st.m][0],tot(a));\n\nfunction stacked(el,M,labels,opts={}){\n  let ks=[...M.keys()];\n  if(opts.order==='idx')ks.sort((a,b)=>idx(M.get(b))-idx(M.get(a)));else ks.sort((a,b)=>a-b);\n  const sel=opts.sel!==undefined?opts.sel:st[opts.key];\n  let h=`<div class=\"sr head\"><span><\/span><span><\/span><span class=\"r\">Confirm.<\/span><span class=\"r vv\">${st.m==='v'?'Vlr. Aberto':'Títulos'}<\/span><\/div>`;\n  for(const k of ks){const a=M.get(k),t=tot(a);if(!t)continue;\n    const segs=a[st.m].map((x,i)=>x>0?`<i style=\"width:${pct(x,t)}%;background:${col(i)}\"><\/i>`:'').join('');\n    const id=tipFor(labels[k],a);\n    h+=`<div class=\"sr\" data-k=\"${k}\" data-tip=\"${id}\" style=\"${sel===k?'outline:2px solid var(--accent);':''}${sel>=0&&sel!==k?'opacity:.45':''}\"><span class=\"lab\" title=\"${esc(labels[k])}\">${esc(labels[k])}<\/span><div class=\"bar\">${segs}<\/div><span class=\"r num idx\">${fP(idx(a))}<\/span><span class=\"r num vv\">${st.m==='v'?'R$ '+fmtMi(t)+' mi':fmtN(t)}<\/span><\/div>`;}\n  el.innerHTML=h;\n  el.querySelectorAll('.sr[data-k]').forEach(d=>d.onclick=()=>opts.click?opts.click(+d.dataset.k):setF(opts.key,+d.dataset.k));\n}\n\nfunction kpis(rows){const a=z();for(const r of rows){const c=motCls[r[5]];a.q[c]+=r[6];a.v[c]+=r[7];}\n const tq=a.q.reduce((x,y)=>x+y,0),tv=a.v.reduce((x,y)=>x+y,0),m=st.m,T=m==='v'?tv:tq;\n const sub=i=>m==='v'?`${fmtBRL(a.v[i])} · ${fmtN(a.q[i])} títulos`:`${fmtN(a.q[i])} títulos · ${fmtBRL(a.v[i])}`;\n const ceds=new Set(rows.map(r=>r[3])).size;\n $('#kpis').innerHTML=`\n  <div class=\"kpi\"><div class=\"l\">Vlr. Aberto em checagem<\/div><div class=\"v num\">R$ ${fmtMi(tv)} mi<\/div><div class=\"s\">${fmtN(tq)} títulos · ${fmtN(ceds)} cedentes<\/div><\/div>\n  <div class=\"kpi\"><div class=\"l\"><i class=\"dot\" style=\"background:${col(0)}\"><\/i>Índice de confirmação<\/div><div class=\"v num\">${fP(pct(a[m][0],T))}<\/div><div class=\"s\">${sub(0)}<\/div><\/div>\n  <div class=\"kpi\"><div class=\"l\"><i class=\"dot\" style=\"background:${col(1)}\"><\/i>Baixa operacional<\/div><div class=\"v num\">${fP(pct(a[m][1],T))}<\/div><div class=\"s\">${sub(1)}<\/div><\/div>\n  <div class=\"kpi click\" id=\"kPend\" title=\"Ver sacados e títulos pendentes de confirmação\"><div class=\"l\"><i class=\"dot\" style=\"background:${col(2)}\"><\/i>Pendente<\/div><div class=\"v num\">${fP(pct(a[m][2],T))}<\/div><div class=\"s\">${sub(2)}<\/div><div class=\"go\">Ver sacados e títulos →<\/div><\/div>\n  <div class=\"kpi click\" id=\"kProb\" title=\"Ver sacados e títulos com problema\"><div class=\"l\"><i class=\"dot\" style=\"background:${col(3)}\"><\/i>Problema<\/div><div class=\"v num\">${fP(pct(a[m][3],T))}<\/div><div class=\"s\">${sub(3)}<\/div><div class=\"go\">Ver sacados e títulos →<\/div><\/div>`;\n $('#kProb').onclick=()=>openProb('prob');$('#kPend').onclick=()=>openProb('pend');}\n\nfunction heat(rows){const RT=agg(rows,r=>r[1]);const regs=[...RT.keys()].filter(k=>tot(RT.get(k))>0).sort((a,b)=>idx(RT.get(b))-idx(RT.get(a)));\n const fmtM=x=>st.m==='v'?'R$ '+fmtMi(x)+' mi':fmtN(x)+' tít.';\n const cell=(a,i)=>{const T=tot(a),x=a[st.m][i],p=pct(x,T);return `<td style=\"background:color-mix(in srgb, var(${CV[i]}) ${Math.round(p*0.55)}%, transparent)\"><b>${fP(p)}<\/b> <span style=\"opacity:.75;font-size:11px\">(${fmtM(x)})<\/span><\/td>`;};\n const row=(lab,a,b)=>{const id=tipFor(lab,a);return `<tr data-tip=\"${id}\"><td class=\"rl\">${b?'<b>'+esc(lab)+'<\/b>':esc(lab)}<\/td>${CL.map((c,i)=>cell(a,i)).join('')}<td style=\"background:var(--surface-2)\"><b>${fmtM(tot(a))}<\/b> <span style=\"opacity:.75;font-size:11px\">(100%)<\/span><\/td><\/tr>`;};\n let h=`<thead><tr><th style=\"text-align:left\">Regional<\/th>${CL.map((c,i)=>`<th><span class=\"badge\" style=\"color:inherit\"><i class=\"dot\" style=\"background:${col(i)}\"><\/i>${c}<\/span><\/th>`).join('')}<th>Total<\/th><\/tr><\/thead><tbody>`;\n for(const r of regs)h+=row(D.regs[r],RT.get(r));\n const all=z();for(const a of RT.values())for(let i=0;i<4;i++){all.q[i]+=a.q[i];all.v[i]+=a.v[i];}\n h+=row('Total',all,1)+'<\/tbody>';\n $('#tHeat').innerHTML=h;}\n\nfunction sortTable(data,s){const k=s.k,d=s.d;return data.sort((a,b)=>{const x=a[k],y=b[k];return (typeof x==='string'?x.localeCompare(y):x-y)*d;});}\nfunction thead(cols,s,fn){return '<thead><tr>'+cols.map(c=>`<th class=\"${c.r?'r':''}\" data-k=\"${c.k}\">${c.t}${s.k===c.k?`<span class=\"ar\">${s.d>0?'▲':'▼'}<\/span>`:''}<\/th>`).join('')+'<\/tr><\/thead>';}\nfunction bindSort(tbl,s,re){tbl.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(s.k===k)s.d*=-1;else{s.k=k;s.d=(k==='nome'||k==='mot'||k==='reg'||k==='pri'||k==='cls')?1:-1;}re();});}\nfunction mini(a){const t=tot(a);return `<div class=\"mini\">${a[st.m].map((x,i)=>x>0?`<i style=\"width:${pct(x,t)}%;background:${col(i)}\"><\/i>`:'').join('')}<\/div>`;}\n\nfunction renderMot(rows){const M=agg(rows,r=>r[5]);let T=0;for(const a of M.values())T+=tot(a);\n const data=[...M.entries()].map(([k,a])=>({k,mot:D.motivos[k],cls:D.classes[k],c:motCls[k],q:a.q.reduce((x,y)=>x+y,0),v:a.v.reduce((x,y)=>x+y,0),p:pct(tot(a),T)}));\n sortTable(data,st.sortMot);\n $('#motCount').textContent=fmtN(data.length)+' motivos';\n const cols=[{k:'mot',t:'Motivo Entrega'},{k:'cls',t:'Situação'},{k:'q',t:'Títulos',r:1},{k:'v',t:'Vlr. Aberto',r:1},{k:'p',t:'% da medida',r:1}];\n const mx=Math.max(...data.map(d=>d.p),1);\n $('#tMot').innerHTML=thead(cols,st.sortMot)+'<tbody>'+data.map(d=>`<tr data-k=\"${d.k}\" style=\"cursor:pointer;${st.mot===d.k?'outline:2px solid var(--accent)':''}\"><td class=\"wr\">${esc(d.mot)}<\/td><td><span class=\"badge\"><i class=\"dot\" style=\"background:${col(d.c)}\"><\/i>${d.cls}<\/span><\/td><td class=\"r num\">${fmtN(d.q)}<\/td><td class=\"r num\">${fmtBRL(d.v)}<\/td><td class=\"r num\"><span style=\"display:inline-flex;align-items:center;gap:8px;justify-content:flex-end\"><span style=\"display:inline-block;height:8px;width:${Math.max(1,60*d.p/mx)}px;background:${col(d.c)};border-radius:2px\"><\/span>${fP(d.p)}<\/span><\/td><\/tr>`).join('')+'<\/tbody>';\n bindSort($('#tMot'),st.sortMot,()=>renderMot(lastRows));\n $('#tMot').querySelectorAll('tbody tr').forEach(tr=>tr.onclick=()=>setF('mot',+tr.dataset.k));}\n\nlet grpData=[];\nfunction grpFilt(){let d=grpData;if(st.qg)d=d.filter(x=>(x.cod+' '+x.nome).toUpperCase().includes(st.qg));return sortTable(d,st.sortGrp);}\nfunction renderGrp(rows){const M=agg(rows,r=>r[9]);const meta=new Map();for(const r of rows){let m=meta.get(r[9]);if(!m){m={reg:new Set(),pri:new Set(),ced:new Set()};meta.set(r[9],m);}m.reg.add(r[1]);m.pri.add(r[2]);m.ced.add(r[3]);}\n grpData=[...M.entries()].map(([k,a])=>{const g=D.grupos[k],t=tot(a),m=meta.get(k);return {k,cod:g[0],nome:g[1],nc:m.ced.size,reg:[...m.reg].map(i=>D.regs[i]). /* Síntese do Risco: arquivo igual ao modelo (aba SINTESE DO RISCO com tabela dinâmica filtrável por cedente; sem a aba BASE) */
const SinteseXlsx=(()=>{
  const xe=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"");
  const colN=c=>{let n=0;for(const ch of c)n=n*26+ch.charCodeAt(0)-64;return n};
  const cmp=(a,b)=>String(a).localeCompare(String(b),"pt-BR",{numeric:true});
  const nk=s=>String(s==null?"":s).normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").trim().toUpperCase();
  const FIELDS=["Cedente","Rótulo","Motivo Entrega","Vlr. Aberto","PRICING","REGIONAL2","RATING AGRO","RATING","DIFICULDADE DE CHECAGEM"];
  const ROWF=[5,8,4,7,6,1,2],AST=[13,17,20,22,24,25,27];
  /* T: títulos já classificados [{cod,rot,mot,v,c}], ref(cod) -> {regional,dificuldade,pricing,rating,ragro}, nome(cod) */
  function gerar(X,T,ref,nome,codIni,desempenho,motConf){
    // ---- valores dos campos
    const nomes=new Map();const cods=[...new Set(T.map(t=>t.cod))];
    const porNome=new Map();cods.forEach(c=>{const n=String(nome(c)||c).trim();porNome.set(n,(porNome.get(n)||0)+1)});
    cods.forEach(c=>{const n=String(nome(c)||c).trim();nomes.set(c,porNome.get(n)>1?`${n} (${c})`:n)});
    const vals=FIELDS.map(()=>new Map());const add=(f,v)=>{v=String(v);if(!vals[f].has(v))vals[f].set(v,vals[f].size);return vals[f].get(v)};
    const agg=new Map();let vmin=Infinity,vmax=-Infinity;
    for(const t of T){const r=ref(t.cod);const k=[add(0,nomes.get(t.cod)),add(1,t.rot||"(vazio)"),add(2,t.mot||"(vazio)"),-1,add(4,r.pricing||"#N/A"),add(5,r.regional||"#N/A"),add(6,r.ragro||"NÃO É AGRO"),add(7,r.rating||"SEM RATING AGRO"),add(8,r.dificuldade||"#N/A")];
      const key=k.join(",");agg.set(key,(agg.get(key)||0)+t.v)}
    const recs=[...agg.entries()].map(([k,v])=>{const a=k.split(",").map(Number);a[3]=Math.round(v*100)/100;if(a[3]<vmin)vmin=a[3];if(a[3]>vmax)vmax=a[3];return a});
    const shared=vals.map(m=>[...m.keys()]);
    // ordem dos itens em cada campo (alfabética), posição -> índice compartilhado
    const ordem=shared.map(arr=>arr.map((v,i)=>i).sort((a,b)=>cmp(arr[a],arr[b])));
    const pos=ordem.map(o=>{const p=[];o.forEach((si,pi)=>p[si]=pi);return p});
    // ---- árvore de cada cedente (para o layout inicial e para saber o tamanho máximo)
    const arvore=ci=>{const root={c:new Map(),v:0};for(const a of recs){if(a[0]!==ci)continue;root.v+=a[3];let n=root;for(const f of ROWF){const k=a[f];let m=n.c.get(k);if(!m){m={c:new Map(),v:0};n.c.set(k,m)}m.v+=a[3];n=m}}return root};
    const linhasDe=(root)=>{const L=[];const walk=(n,d)=>{let ks=[...n.c.keys()];const f=ROWF[d];if(f===2)ks.sort((a,b)=>n.c.get(b).v-n.c.get(a).v);else ks.sort((a,b)=>pos[f][a]-pos[f][b]);for(const k of ks){const m=n.c.get(k);L.push({d,f,k,v:m.v});if(d<ROWF.length-1)walk(m,d+1)}};walk(root,0);return L};
    let maxL=0;const cedIdx=shared[0].map((n,i)=>i);for(const ci of cedIdx){const L=linhasDe(arvore(ci));if(L.length>maxL)maxL=L.length}
    let ini=nomes.has(String(codIni))?shared[0].indexOf(nomes.get(String(codIni))):-1;if(ini<0)ini=ordem[0][0]||0;
    const root=arvore(ini),L=linhasDe(root),TOT=root.v||0;
    // ---- planilha
    const cells=new Map();const rowsH={...SINT_TPL.model.rows};
    const setC=(ref,o)=>cells.set(ref,o);
    for(const[ref,e]of Object.entries(SINT_TPL.model.cells))setC(ref,{...e});
    setC("A4",{v:"Cedente"});setC("B4",{v:shared[0][ini]});
    setC("A6",{s:10,v:"STATUS"});setC("B6",{s:10,v:"RISCO"});setC("C6",{s:11,v:"%"});
    let r=7;for(const l of L){setC("A"+r,{s:AST[l.d],v:shared[l.f][l.k]});setC("B"+r,{s:14,v:l.v,n:1});setC("C"+r,{s:15,v:TOT?l.v/TOT:0,n:1});r++}
    const fimPiv=r;setC("A"+r,{s:34,v:"TOTAL"});setC("B"+r,{s:35,v:TOT,n:1});setC("C"+r,{s:36,v:TOT?1:0,n:1});
    for(let k=r+1;k<=34;k++)["A","B","C"].forEach(c=>cells.delete(c+k));
    // listas usadas nas fórmulas (como no modelo, mais abaixo na planilha)
    const L0=Math.max(101,7+maxL+20),lim=L0-12;
    const pctMot=new Map();L.filter(l=>l.f===2).forEach(l=>pctMot.set(shared[2][l.k],(pctMot.get(shared[2][l.k])||0)+(TOT?l.v/TOT:0)));
    let q=L0;const lista=(itens,sty)=>{const a=q;for(const m of itens){setC("A"+q,{s:42,v:m});setC("B"+q,{s:40,f:`SUMIF($A$5:$A$${lim},A${q},$C$5:$C$${lim})`,v:pctMot.get(m)||0,n:1});q++}
      const tot=itens.reduce((s,m)=>s+(pctMot.get(m)||0),0);setC("B"+q,{s:45,f:`SUM(B${a}:B${q-1})`,v:tot,n:1});const ref="B"+q;q+=6;return{ref,tot}};
    const todosMot=[...new Set([...motConf.conf,...shared[2]])];
    const conf=lista([...new Set([...motConf.conf,...shared[2].filter(m=>motConf.eConf(m))])]);
    const c99=lista([...new Set([...motConf.c99,...shared[2].filter(m=>/^C99/i.test(m.trim()))])]);
    const nc=lista([...new Set([...motConf.nc,...shared[2].filter(m=>/^NADA CONSTA/.test(nk(m)))])]);
    const d0=q;setC("A"+q,{s:42,v:"REGIONAL"});setC("B"+q,{s:42,v:"CLASSIFICAÇÃO"});q++;const dsp=String(desempenho||"").split("\n").map(x=>x.split(";")).filter(p=>p[0]&&p[0].trim());
    for(const p of dsp){setC("A"+q,{s:42,v:p[0].trim()});setC("B"+q,{s:42,v:(p[1]||"").trim()});q++}
    const regIni=L.find(l=>l.d===0);const dVal=regIni?((dsp.find(p=>nk(p[0])===nk(shared[5][regIni.k]))||[])[1]||"").trim():"";
    setC("E5",{s:9,f:conf.ref,v:conf.tot,n:1});setC("E7",{s:16,f:c99.ref,v:c99.tot,n:1});setC("E9",{s:21,f:nc.ref,v:nc.tot,n:1});
    setC("E12",{s:26,f:`IFERROR(VLOOKUP(A7,$A$${d0+1}:$B$${q-1},2,FALSE),"")`,v:dVal||"",str:1});

const idb={p:null,open(){if(this.p)return this.p;this.p=new Promise((res,rej)=>{try{const r=indexedDB.open("mesa-carteiras",1);r.onupgradeneeded=()=>r.result.createObjectStore("bases");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return this.p},
  async tx(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction("bases",mode);const st=t.objectStore("bases");const r=fn(st);t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})},
  get(k){return this.tx("readonly",st=>st.get(k)).catch(()=>null)},put(k,v){return this.tx("readwrite",st=>st.put(v,k)).then(()=>true).catch(()=>false)},del(k){return this.tx("readwrite",st=>st.delete(k)).catch(()=>null)}};

async function loadBase(date){
  if(!date)return null;if(S.bases.has(date))return S.bases.get(date);
  if(store.kind==="local"){const v=await idb.get(date);S.bases.set(date,v||null);return v||null}
  const docs=await store.baseDocs(date);const out={};
  ["car","tra"].forEach(k=>{const dict=docs.find(d=>d.kind===k&&d.part===-1);if(!dict)return;
    const parts=docs.filter(d=>d.kind===k&&d.part>=0).sort((a,b)=>a.part-b.part);if(parts.length!==dict.parts)return;
    const rows=[];parts.forEach(p=>rows.push(...JSON.parse(p.r)));
    out[k]={rows,mot:dict.mot,sac:dict.sac,rot:dict.rot,dst:dict.dst,org:dict.org||{},ced:dict.ced||{},ass:dict.ass||{},fil:dict.fil||[],rgl:dict.rgl||[],obs:dict.obs||[],ext:dict.ext||{},regional:dict.regional||""}});
  const res=out.car||out.tra?out:null;S.bases.set(date,res);return res;
}
function needBase(date,cb){
  if(!date||S.bases.has(date))return S.bases.get(date)||null;
  if(!S.loadingBase.has(date)){S.loadingBase.add(date);loadBase(date).catch(()=>S.bases.set(date,null)).finally(()=>{S.loadingBase.delete(date);render();if(cb)cb()})}
  return undefined;
}
function baseChunks(date,kind,b){
  const docs=[];const dict={date,kind,part:-1,mot:b.mot,sac:b.sac,rot:b.rot,dst:b.dst,org:b.org,ced:b.ced,ass:b.ass||{},fil:b.fil||[],rgl:b.rgl||[],obs:b.obs||[],ext:b.ext||{},regional:b.regional||""};
  let part=0,cur=[],len=0;const flush=()=>{docs.push({id:`${date}_${kind}_${part}`,data:{date,kind,part,r:JSON.stringify(cur)}});part++;cur=[];len=0};
  b.rows.forEach(r=>{const s=JSON.stringify(r).length+1;if(len+s>200000)flush();cur.push(r);len+=s});if(cur.length||!part)flush();
  dict.parts=part;docs.push({id:`${date}_${kind}_d`,data:dict});return docs;
}

/* leitura da planilha em segundo plano (Web Worker), só com as abas necessárias */
const XLSX_URL="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js";
const ABAS_QUERO=["CHAMADOS","BASE CARTEIRAS","BASE - TRANCHE","DATA DA BASE","RISCO PRINCING","LIMITE - TRANCHE","CARACTERISTICA","METAS ESPECIAIS","METAS TRANCHE"];
function lerPlanilhaCorpo(X,buf,want){
  const tp=typeof buf==="string"?"string":"array";const meta=X.read(buf,{type:tp,bookSheets:true,raw:tp==="string"});const names=meta.SheetNames,up=names.map(n=>n.toUpperCase());
  let pick=names.filter((n,i)=>want.includes(up[i])||/CHAMADO/.test(up[i]));if(!pick.some(n=>/^BASE /i.test(n)))pick=names.slice(0,3);
  const wb=X.read(buf,{type:tp,raw:tp==="string",sheets:pick,dense:true,cellStyles:false,cellHTML:false,cellText:false,cellFormula:false,cellNF:false});
  const sheets={};pick.forEach(n=>{const ws=wb.Sheets[n];if(ws)sheets[n]=X.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:false})});
  return{names,sheets};
}
let workerOk=true;
async function lerPlanilha(file,aviso){
  let buf=await file.arrayBuffer();
  if(/\.(csv|txt)$/i.test(file.name)){let t;try{t=new TextDecoder("utf-8",{fatal:true}).decode(buf)}catch(e){t=new TextDecoder("windows-1252").decode(buf)}buf=t.replace(/^\uFEFF/,"")}
  if(workerOk&&window.Worker&&window.Blob){
    try{
      const src=`importScripts(${JSON.stringify(XLSX_URL)});const lerPlanilhaCorpo=${lerPlanilhaCorpo.toString()};onmessage=e=>{try{postMessage({ok:true,r:lerPlanilhaCorpo(XLSX,e.data.buf,e.data.want)})}catch(err){postMessage({ok:false,msg:String(err&&err.message||err)})}}`;
      const url=URL.createObjectURL(new Blob([src],{type:"text/javascript"}));
      const r=await new Promise((res,rej)=>{let w;try{w=new Worker(url)}catch(e){rej(e);return}
        const t=setTimeout(()=>{w.terminate();rej(new Error("tempo"))},180000);
        w.onmessage=e=>{clearTimeout(t);w.terminate();e.data.ok?res(e.data.r):rej(Object.assign(new Error(e.data.msg),{planilha:true}))};
        w.onerror=e=>{clearTimeout(t);w.terminate();rej(new Error("worker"))};
        w.postMessage({buf,want:ABAS_QUERO},typeof buf==="string"?[]:[buf])});
      URL.revokeObjectURL(url);return r;
    }catch(e){if(e.planilha)throw new Error("Não consegui ler a planilha: "+e.message);workerOk=false}
  }
  if(aviso)aviso("Lendo a planilha (a tela pode parar por alguns segundos)…");
  await new Promise(r=>setTimeout(r,60));
  const X=await XLSXlib();return lerPlanilhaCorpo(X,typeof buf==="string"?buf:await file.arrayBuffer(),ABAS_QUERO);
}
const pausa=()=>new Promise(r=>setTimeout(r,0));
async function lerArquivo(file,dates){const X=await XLSXlib();const buf=await file.arrayBuffer();
  if(/\.(csv|txt)$/i.test(file.name)){let t;try{t=new TextDecoder("utf-8",{fatal:true}).decode(buf)}catch(e){t=new TextDecoder("windows-1252").decode(buf)}return X.read(t.replace(/^\uFEFF/,""),{type:"string",raw:true})}

}

function chSt(c,asOf){asOf=asOf||today();if(c.fechamento&&c.fechamento<=asOf)return"Fechado";if(!c.abertura)return"Sem data";
  const at=c.ultAtualizacao&&c.ultAtualizacao<=asOf?c.ultAtualizacao:null,rs=[c.resposta,c.ultRetorno].filter(d=>d&&d<=asOf).sort().pop()||null;

const SBC={cli:null,user:null,eu:null,membros:[],hist:null,
  conf(){if(!window.supabase||!window.supabase.createClient)return null;let c=null;try{c=window.MESA_SB&&window.MESA_SB.url?window.MESA_SB:JSON.parse(localStorage.getItem("mesa_sb")||"null")}catch(e){}if(c&&c.url)c={...c,url:String(c.url).trim().replace(/\/(rest|auth)\/v1\/?$/,"").replace(/\/+$/,"")};return c&&c.url&&c.key?c:null}};
let sbT=null;function sbRender(){clearTimeout(sbT);sbT=setTimeout(render,120)}
let vigiando=false;
async function sbIniciar(){if(!vigiando){vigiando=true;vigiarMeiaNoite()}
  const c=SBC.conf();SBC.cli=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true}});
  SBC.cli.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT"){SBC.user=null;SBC.eu=null;S.mode="login";S.auth={tab:"entrar"};render()}});
  let ses=null;try{const{data}=await SBC.cli.auth.getSession();ses=data&&data.session}catch(e){}
  if(ses&&loginDia()!==diaSP()){await sessaoExpirada();return}
  if(ses)await sbEntrar(ses.user);else{S.mode="login";render()}
}
/* login vale só até a meia-noite (horário de Brasília): no dia seguinte, todo mundo entra de novo */
const diaSP=()=>{try{return new Intl.DateTimeFormat("en-CA",{timeZone:"America/Sao_Paulo",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date())}catch(e){return today()}};
const loginDia=()=>{try{return localStorage.getItem("mesa_login_dia")||""}catch(e){return""}};
const marcarLoginDia=()=>{try{localStorage.setItem("mesa_login_dia",diaSP())}catch(e){}};
async function sessaoExpirada(){SBC.jaEntrou=false;try{sessionStorage.removeItem("mesa_escolheu");localStorage.removeItem("mesa_login_dia")}catch(e){}S.escolher=true;if(D)closeDrawer();
  try{if(SBC.cli)await SBC.cli.auth.signOut()}catch(e){}SBC.user=null;SBC.eu=null;S.mode="login";S.auth={tab:"entrar",msg:"Sua sessão terminou à meia-noite. Entre de novo para continuar."};render()}
function vigiarMeiaNoite(){const ck=()=>{if(store.kind==="sb"&&SBC.user&&loginDia()!==diaSP())sessaoExpirada()};setInterval(ck,60000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)ck()});window.addEventListener("focus",ck)}
async function sbTodos(q){let out=[],from=0;for(;;){const{data,error}=await q().range(from,from+999);if(error)throw error;out=out.concat(data||[]);if(!data||data.length<1000)break;from+=1000}return out}
async function sbEntrar(user){
  SBC.user=user;S.mode="loading";render();
  try{
    const{data:mem,error}=await SBC.cli.from("membros").select("*");if(error)throw error;
    SBC.membros=mem||[];SBC.eu=SBC.membros.find(m=>String(m.email).toLowerCase()===String(user.email).toLowerCase())||null;
    if(!SBC.eu){S.mode="semacesso";render();return}
    if(user.user_metadata&&user.user_metadata.trocar_senha){S.mode="trocar";S.auth={};render();return}
    for(const col of["cfg","caract","anot","chamados","parecer","feito"]){const rows=await sbTodos(()=>SBC.cli.from("docs").select("id,data").eq("col",col));rows.forEach(r=>store.apply(col,r.id,r.data))}
    const rg=await SBC.cli.from("docs").select("id,data").eq("col","reg").order("id",{ascending:false}).limit(70);if(rg.error)throw rg.error;(rg.data||[]).forEach(r=>store.apply("reg",r.id,r.data));
    const qp=await SBC.cli.from("docs").select("id,data").eq("col","qprof").order("updated_at",{ascending:false}).limit(60);(qp.data||[]).forEach(r=>store.apply("qprof",r.id,r.data));
    if(!SBC.canal)SBC.canal=SBC.cli.channel("docs-mesa").on("postgres_changes",{event:"*",schema:"public",table:"docs"},p=>{const row=p.eventType==="DELETE"?p.old:p.new;if(!row||!row.col||row.col==="base")return;store.apply(row.col,row.id,p.eventType==="DELETE"?null:row.data);sbRender()}).subscribe();
    S.mode="sb";if(!SBC.jaEntrou){SBC.jaEntrou=true;SBC.cli.rpc("registrar_acesso").then(()=>{},()=>{})}render();
  }catch(e){S.mode="login";S.auth={tab:"entrar",err:"Não consegui carregar os dados ("+(e.message||e)+"). Confira se o setup.sql foi rodado no Supabase."};render()}
}
const vIn=id=>{const el=document.getElementById(id);return el?el.value:""};
function trErr(e){const m=String(e&&e.message||e||"");
  if(/banned|bloquead/i.test(m))return"Seu acesso está bloqueado porque a senha foi digitada errada 3 vezes. Peça a um administrador para liberar.";
  if(/invalid login credentials/i.test(m))return"E-mail ou senha incorretos.";
  if(/email not confirmed/i.test(m))return"Este acesso ainda não foi ativado. Fale com o administrador da equipe.";
  if(/expired|invalid/i.test(m)&&/token|otp|code/i.test(m))return"Código inválido ou vencido. Peça um novo código.";
  if(/rate limit|security purposes|too many/i.test(m))return"Muitas tentativas seguidas. Espere um minuto e tente de novo.";
  if(/não foi liberado|nao foi liberado|hook/i.test(m))return"Este e-mail não foi liberado pelo administrador.";
  if(/already registered|already exists/i.test(m))return"Este e-mail já tem acesso. Use “Entrar” ou “Esqueci a senha”.";
  if(/password should be|weak password/i.test(m))return"Senha fraca. Use pelo menos 8 caracteres, misturando letras e números.";
  if(/fetch|network/i.test(m))return"Sem conexão com o banco. Verifique a internet.";
  return m||"Algo deu errado. Tente de novo.";}
const senhaOk=(a,b)=>a.length<8?"A senha precisa ter pelo menos 8 caracteres.":a!==b?"As senhas digitadas não são iguais.":"";

   <form id="fPrimeira" class="form"><label class="fl">Nova senha (mínimo 8 caracteres)<input class="inp" id="au_s1" type="password" autocomplete="new-password"></label><label class="fl">Repita a nova senha<input class="inp" id="au_s2" type="password" autocomplete="new-password"></label>

async function authSubmit(id){
  const A=S.auth||{};const cli=SBC.cli;if(!cli)return;
  const busy=()=>{S.auth={...S.auth,busy:true,err:"",msg:""};render()};
  try{
    if(id==="fEntrar"){const email=vIn("au_email").trim().toLowerCase(),senha=vIn("au_senha");if(!emailOk(email)||!senha)return authErr("Informe o e-mail e a senha.");
      S.auth={...A,email};busy();const{data,error}=await cli.auth.signInWithPassword({email,password:senha});if(!error)marcarLoginDia();
      if(error){if(/invalid login credentials/i.test(String(error.message))){let r=null;try{const x=await cli.rpc("senha_errada",{p_email:email});if(!x.error)r=x.data}catch(e){}
          if(r===0)return authErr("Senha errada pela 3ª vez: seu acesso foi bloqueado. Peça a um administrador para liberar.");
          if(r>0)return authErr("E-mail ou senha incorretos. "+(r===1?"Resta 1 tentativa":"Restam "+r+" tentativas")+" antes de o acesso ser bloqueado.")}
        return authErr(trErr(error))}
      try{await cli.rpc("senha_certa")}catch(e){}
      S.auth={tab:"entrar"};await sbEntrar(data.user)}
    else if(id==="fPrimeira"){const s1=vIn("au_s1"),s2=vIn("au_s2"),e=senhaOk(s1,s2);if(e)return authErr(e);busy();
      const{data,error}=await cli.auth.updateUser({password:s1,data:{trocar_senha:false}});if(error)return authErr(trErr(error));S.auth={tab:"entrar"};toast("Senha salva");await sbEntrar(data.user)}
    else if(id==="fEsqueci"){const email=vIn("au_email").trim().toLowerCase();if(!emailOk(email))return authErr("E-mail inválido.");S.auth={...A,email};busy();
      const{error}=await cli.auth.resetPasswordForEmail(email);if(error)return authErr(trErr(error));S.auth={tab:"esqueci",step:1,email};render()}
    else if(id==="fNova"){const token=vIn("au_cod").replace(/\D/g,""),s1=vIn("au_s1"),s2=vIn("au_s2");if(token.length<6)return authErr("Digite o código de 6 dígitos que chegou no e-mail.");const e=senhaOk(s1,s2);if(e)return authErr(e);busy();
      const v=await cli.auth.verifyOtp({email:A.email,token,type:"recovery"});if(v.error)return authErr(trErr(v.error));marcarLoginDia();
      const u=await cli.auth.updateUser({password:s1});if(u.error)return authErr(trErr(u.error));S.auth={tab:"entrar"};toast("Senha alterada");await sbEntrar(v.data.user)}
  }catch(e){authErr(trErr(e))}
}

     `<p>Acesso criado para <b>${esc(nome)}</b>. Passe estes dados para a pessoa por mensagem direta:</p><pre class="pre">${esc(txt)}</pre><button class="btn pri" data-act="copyTxt" data-t="${esc(txt)}">Copiar</button><p class="hint">No primeiro acesso o site pede para ela trocar a senha provisória por uma senha própria.</p>`,`<button class="btn" data-act="close">Fechar</button>`);

function situacaoAcesso(m,podeLiberar){
  if(m.bloqueado)return`<span class="st bad">Bloqueado</span>${m.bloqueado_em?` <span class="muted">desde ${fdh(m.bloqueado_em)}</span>`:""}${podeLiberar?` <button class="btn sm pri" data-act="liberar" data-v="${esc(m.email)}">Liberar acesso</button>`:""}`;
  if(m.tentativas>0)return`<span class="st warn">${m.tentativas} senha${m.tentativas>1?"s":""} errada${m.tentativas>1?"s":""}</span>`;
  return'<span class="st ok">Ativo</span>'}
const fdh=s=>{const d=new Date(s);if(isNaN(d))return"";return d.toLocaleDateString("pt-BR")+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})};
function avisoBloqueados(){if(!(store.kind==="sb"&&ehAdmin()))return"";const b=(SBC.membros||[]).filter(m=>m.bloqueado);if(!b.length)return"";
  return`<div class="warn-box bloq"><b>${b.length===1?"1 pessoa está":b.length+" pessoas estão"} com o acesso bloqueado</b> por errar a senha 3 vezes:<ul>${b.map(m=>`<li>${esc(m.nome||m.email)} <span class="muted">(${esc(m.email)}${m.bloqueado_em?" · desde "+fdh(m.bloqueado_em):""})</span> <button class="btn sm pri" data-act="liberar" data-v="${esc(m.email)}">Liberar acesso</button></li>`).join("")}</ul></div>`}

function backupDocs(){const out=[];const pushMap=(col,m,wrap)=>Object.entries(m).forEach(([id,v])=>out.push({col,id,data:wrap?wrap(v):v}));
  out.push({col:"cfg",id:"geral",data:S.cfg},{col:"cfg",id:"risco",data:{map:S.risco}},{col:"cfg",id:"limites",data:{map:S.lim}},{col:"cfg",id:"grupos",data:{map:S.grupos}},{col:"cfg",id:"diario",data:{map:S.diario}},{col:"cfg",id:"responsaveis",data:{map:S.resp}});
  pushMap("caract",S.car);pushMap("anot",S.anot);pushMap("reg",S.regs);pushMap("chamados",S.chamados);pushMap("parecer",S.parecer);pushMap("qprof",S.qprofs);pushMap("feito",S.feito,v=>({ids:v}));return out}
async function backupBaixar(){
  toast("Preparando backup…");const docs=backupDocs();
  for(const d of regDatas()){if(!S.regs[d].temBase)continue;try{if(store.remote()){(await store.baseDocs(d)).forEach(x=>{const{id,...data}=x;docs.push({col:"base",id,data})})}else{const b=await idb.get(d);if(b)["car","tra"].forEach(k=>{if(b[k])baseChunks(d,k,b[k]).forEach(x=>docs.push({col:"base",id:x.id,data:x.data}))})}}catch(e){}}
  await baixar("mesa-carteiras-backup-"+today()+".json",new TextEncoder().encode(JSON.stringify({app:"mesa-carteiras",v:1,gerado:new Date().toISOString(),docs})),"application/json");
}
async function backupLer(file){
  try{const j=JSON.parse(await file.text());if(!j||j.app!=="mesa-carteiras"||!Array.isArray(j.docs))throw new Error("Este arquivo não é um backup da Mesa de Carteiras.");
    const n=j.docs.filter(d=>d.col!=="base").length,nb=new Set(j.docs.filter(d=>d.col==="base").map(d=>d.data.date)).size;D={kind:"backup",j};
    drawer("Restaurar backup",`<p>Backup de <b>${new Date(j.gerado).toLocaleString("pt-BR")}</b>: ${n} registros (anotações, chamados, posições, parâmetros…) e ${nb} base(s) título a título.</p><p class="warn-box">Os registros com o mesmo nome no ${store.kind==="sb"?"banco da equipe":"site"} serão substituídos pela versão do backup. Registros que só existem aqui ficam como estão.</p><div class="err" id="bk_err"></div>`,`<button class="btn" data-act="close">Cancelar</button><button class="btn pri" data-act="backupAplicar" id="bk_go">Restaurar</button>`)}
  catch(e){toast(e.message||"Arquivo inválido.")}
}
async function backupAplicar(){
  const j=D&&D.j;if(!j)return;const go=$("#bk_go");go.disabled=true;go.textContent="Restaurando…";
  try{
    if(store.kind==="sb"){const small=j.docs.filter(d=>d.col!=="base"),big=j.docs.filter(d=>d.col==="base");
      for(let i=0;i<small.length;i+=40){const{error}=await SBC.cli.from("docs").upsert(small.slice(i,i+40));if(error)throw error;go.textContent=`Restaurando… ${Math.min(i+40,small.length)}/${small.length}`}
      for(let i=0;i<big.length;i++){const{error}=await SBC.cli.from("docs").upsert(big[i]);if(error)throw error;go.textContent=`Bases… ${i+1}/${big.length}`}
      j.docs.forEach(d=>store.apply(d.col,d.id,d.data));}
    else if(store.kind==="local"){j.docs.forEach(d=>store.apply(d.col,d.id,d.data));store.persist();
      const by={};j.docs.filter(d=>d.col==="base").forEach(d=>{(by[d.data.date]=by[d.data.date]||[]).push({id:d.id,...d.data})});
      for(const[date,docs]of Object.entries(by)){const out={};["car","tra"].forEach(k=>{const dict=docs.find(x=>x.kind===k&&x.part===-1);if(!dict)return;const parts=docs.filter(x=>x.kind===k&&x.part>=0).sort((a,b)=>a.part-b.part);const rows=[];parts.forEach(p=>rows.push(...JSON.parse(p.r)));out[k]={rows,mot:dict.mot,sac:dict.sac,rot:dict.rot,dst:dict.dst,org:dict.org||{},ced:dict.ced||{},ass:dict.ass||{},fil:dict.fil||[],rgl:dict.rgl||[],obs:dict.obs||[],ext:dict.ext||{},regional:dict.regional||""}});await idb.put(date,out)}}
    else{for(const d of j.docs)await store.set(d.col,d.id,d.data)}
    S.bases.clear();closeDrawer();toast("Backup restaurado");render();
  }catch(e){const er=$("#bk_err");if(er)er.textContent="Parou no meio: "+(e.message||e)+". Pode tentar de novo; o que já foi gravado fica.";go.disabled=false;go.textContent="Tentar de novo"}
}
